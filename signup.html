<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign up | Career Sarthii</title>
<meta name="description" content="Create your Career Sarthii account and choose the government exam you are preparing for.">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500;600&family=Noto+Serif+Devanagari:wght@500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet">
<script>(function(){try{var m=JSON.parse(localStorage.getItem('cs_theme'));if(!m)m=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.dataset.theme=m}catch(e){document.documentElement.dataset.theme='light'}})()</script>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site-header"><div class="wrap bar">
<a class="brand" href="index.html"><img src="favicon.svg" alt="" width="28" height="28"><span>Career Sarthii</span></a>
<nav class="nav" id="siteNav" aria-label="Main"><a href="index.html#features" data-i18n="nav.features">Features</a><a href="about.html" data-i18n="nav.about">About</a><a class="nav-login" href="login.html" data-i18n="nav.login">Log in</a></nav>
<div class="tools"><button class="tbtn" id="langBtn" type="button" aria-label="Language">हिंदी</button><button class="tbtn" id="themeBtn" type="button" aria-label="Theme">Dark</button><a class="btn ghost sm hide-m" href="login.html" data-i18n="nav.login">Log in</a><a class="btn sm" href="signup.html" data-i18n="nav.signup">Sign up</a><button class="tbtn menu-btn" id="menuBtn" type="button" aria-label="Menu" aria-expanded="false" aria-controls="siteNav">☰</button></div>
</div></header>
<main class="auth">
<h1 data-i18n="auth.signup">Create your account</h1>
<form id="signupForm" novalidate>
<div class="field"><label for="name" data-i18n="f.name">Full name</label><input id="name" autocomplete="name" required></div>
<div class="row2">
<div class="field"><label for="gender" data-i18n="f.gender">Gender</label><select id="gender" required><option value="" data-i18n="f.select">Select</option><option value="male" data-i18n="g.male">Male</option><option value="female" data-i18n="g.female">Female</option><option value="other" data-i18n="g.other">Other</option></select></div>
<div class="field"><label for="category" data-i18n="f.category">Category</label><select id="category" required><option value="" data-i18n="f.select">Select</option><option value="General" data-i18n="c.gen">General</option><option>OBC</option><option>SC</option><option>ST</option><option>EWS</option><option value="Other" data-i18n="c.other">Other</option></select></div>
</div>
<div class="field"><label for="email" data-i18n="f.email">Email</label><input id="email" type="email" autocomplete="email" required></div>
<div class="field"><label for="pass" data-i18n="f.pass">Password</label><input id="pass" type="password" minlength="8" autocomplete="new-password" required></div>
<div class="field"><label for="qual" data-i18n="f.qual">Qualification</label><select id="qual" required><option value="" data-i18n="f.select">Select</option><option value="10" data-i18n="q.10">10th pass</option><option value="12" data-i18n="q.12">12th pass</option><option value="grad" data-i18n="q.grad">Graduate</option></select></div>
<div class="field"><label for="exam" data-i18n="f.exam">Exam you are preparing for</label><select id="exam" required disabled></select><div class="hint" data-i18n="f.examhint"></div></div>
<label class="check"><input type="checkbox" id="agree"><span><span data-i18n="auth.agree">I agree to the Terms and Conditions and the Privacy Policy.</span> <a href="terms.html" target="_blank" rel="noopener" data-i18n="foot.terms">Terms and Conditions</a>, <a href="privacy.html" target="_blank" rel="noopener" data-i18n="foot.privacy">Privacy Policy</a></span></label>
<div class="err" id="err" role="alert"></div>
<button class="btn" type="submit" data-i18n="nav.signup">Sign up</button>
</form>
<p style="margin-top:20px"><span data-i18n="auth.have">Already have an account?</span> <a href="login.html" data-i18n="nav.login">Log in</a></p>
</main>
<footer class="site-footer"><div class="wrap"><strong>Career Sarthii</strong><a href="privacy.html" data-i18n="foot.privacy">Privacy Policy</a><a href="terms.html" data-i18n="foot.terms">Terms and Conditions</a><span class="sp">&copy; 2026 Career Sarthii. <span data-i18n="foot.rights">All rights reserved.</span></span></div></footer>
<script src="js/common.js"></script>
<script src="js/data.js"></script><script src="js/auth.js"></script></body></html>
